# cucumber.glue is NOT declared here, for the same reason as cucumber.plugin: the three suites
# need different glue. Cucumber's @BeforeAll and hooks run for any suite whose glue path
# contains them, so a container lifecycle visible to every suite would start ParaBank for the
# Docker-free smoke run, and a browser hook on the shared steps path would open a browser for
# the api suite. The glue packages are therefore set per suite in this module's pom.xml:
#   Surefire (smoke):        the framework hooks and the shared steps.
#   Failsafe api-suite:      those, plus the container lifecycle package.
#   Failsafe web-suite:      the framework hooks, the web steps and the container lifecycle.
# Glue scanning is recursive, which is why the steps, the web steps and the container
# lifecycle live in sibling packages rather than one package with subpackages.

# cucumber.plugin is NOT declared here. Three suites share this file - ParaBankTestSuite under
# Surefire, ParaBankIT and ParaBankWebIT under two Failsafe executions - and each must write its
# own message log, or one run would overwrite another and the CI gate would assert against the
# wrong one. Worse than wrong: a shared log is also what would stop the gate being able to say
# which layer failed. Each plugin block in this module's pom.xml therefore supplies
# cucumber.plugin as a JVM system property, which outranks this file: pretty and summary for
# humans, plus a message log at target/cucumber-messages.ndjson,
# target/failsafe-cucumber-messages.ndjson and target/web-cucumber-messages.ndjson.

# Parallel execution is deferred to Phase 3. the suite is small, and enabling
# parallelism before there is a suite large enough to need it would add flakiness with no
# gain. See docs/adr/0005-defer-parallel-execution.md.
cucumber.execution.parallel.enabled=false

# cucumber.filter.tags is deliberately NOT declared here. Surefire supplies it as a JVM
# system property, forwarded from the active Maven profile's ${trident.tags}. Declaring it
# here would either override that or, if resource filtering were ever enabled, bake one
# profile's value in at build time and break profile selection silently.
