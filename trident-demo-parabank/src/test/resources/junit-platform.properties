# cucumber.glue is NOT declared here, for the same reason as cucumber.plugin: the two suites
# need different glue. Cucumber's @BeforeAll runs for any suite whose glue path contains it,
# so a container lifecycle visible to both suites would start ParaBank for the Docker-free
# smoke run too. The glue packages are therefore set per suite in this module's pom.xml:
#   Surefire: the framework hooks and the shared steps.
#   Failsafe: those, plus the container lifecycle package.
# Glue scanning is recursive, which is why the steps and the container lifecycle live in
# sibling packages rather than one package with a subpackage.

# cucumber.plugin is NOT declared here. Two suites share this file - ParaBankTestSuite under
# Surefire and ParaBankIT under Failsafe - and each must write its own message log, or the
# second run would overwrite the first and the CI gate would assert against the wrong one.
# Each plugin block in this module's pom.xml therefore supplies cucumber.plugin as a JVM
# system property, which outranks this file: pretty and summary for humans, plus a message
# log at target/cucumber-messages.ndjson for Surefire and
# target/failsafe-cucumber-messages.ndjson for Failsafe.

# Parallel execution is deferred to Phase 3. the suite is small, and enabling
# parallelism before there is a suite large enough to need it would add flakiness with no
# gain. See docs/adr/0005-defer-parallel-execution.md.
cucumber.execution.parallel.enabled=false

# cucumber.filter.tags is deliberately NOT declared here. Surefire supplies it as a JVM
# system property, forwarded from the active Maven profile's ${trident.tags}. Declaring it
# here would either override that or, if resource filtering were ever enabled, bake one
# profile's value in at build time and break profile selection silently.
