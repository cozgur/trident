# A consumer's own environment file, which is how overriding is meant to work: this is a
# different source path from config/default.properties, so the two MERGE - the key below wins
# and every key it omits still falls back to the framework's shipped defaults.
#
# It lives here rather than inside trident-core because a framework must not ship a value that
# silently overrides its consumers. It used to, and the wiring scenario below could not tell
# the difference.
timeout.default.seconds=5
