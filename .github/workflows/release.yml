name: Release

# Tags only. An ordinary push to main must never be able to publish: a release is a deliberate
# act, and `git push` is not.
on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: Build, sign and publish to Maven Central
    runs-on: ubuntu-latest

    steps:
      - name: Check out the tag
        uses: actions/checkout@v5

      # setup-java imports the signing key and writes the settings.xml server entry the
      # publishing plugin reads. It also configures gpg-agent to accept the passphrase from
      # MAVEN_GPG_PASSPHRASE, which is why the POM carries no pinentry configuration of its own.
      - name: Set up Java 21 and the signing key
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: central
          server-username: CENTRAL_TOKEN_USERNAME
          server-password: CENTRAL_TOKEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      # Maven Central is immutable, so the cheapest possible check runs first: does the tag
      # actually name the version about to be published? Nothing else in the pipeline compares
      # them, and the version is bumped by hand.
      - name: Tag must match the project version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PARENT=$(./mvnw -q -DforceStdout help:evaluate -Dexpression=project.version)
          BOM=$(./mvnw -q -DforceStdout -pl trident-bom help:evaluate -Dexpression=project.version)
          echo "tag=$TAG parent=$PARENT bom=$BOM"
          if [ "$TAG" != "$PARENT" ] || [ "$TAG" != "$BOM" ]; then
            echo "FAIL: tag $TAG does not match parent $PARENT / bom $BOM."
            echo "Run: ./mvnw versions:set -DnewVersion=$TAG -DprocessAllModules=true"
            exit 1
          fi
          echo "OK: tag, parent and BOM all say $TAG."

      # The same checks main gets. A tag is not a reason to publish something that would have
      # failed on a branch.
      - name: Framework modules know nothing about the target
        run: |
          if grep -riE "parabank|testcontainers|docker" \
               trident-core/src trident-api/src trident-runner/src trident-web/src \
               trident-core/pom.xml trident-api/pom.xml trident-runner/pom.xml trident-web/pom.xml; then
            echo "FAIL: target-specific reference found in a published module (above)."
            exit 1
          fi
          echo "OK: no target-specific references in the four framework modules."

          for module in trident-core trident-api trident-runner trident-web trident-bom trident-archetype; do
            ./mvnw -B -q -pl "$module" dependency:list -DincludeScope=compile -DoutputFile="/tmp/deps-$module.txt"
            if grep -qi "allure" "/tmp/deps-$module.txt"; then
              echo "FAIL: $module would put Allure on a consumer's classpath:"
              grep -i "allure" "/tmp/deps-$module.txt"
              exit 1
            fi
          done
          echo "OK: no published module depends on a report adapter."

      - name: Locators stay out of step definitions
        run: |
          step_packages=$(find . -type d \( -name steps -o -name websteps \) -not -path "*/target/*")
          if [ -z "$step_packages" ]; then
            echo "FAIL: found no step packages to check; this guard is looking in the wrong place."
            exit 1
          fi
          if grep -rnE "org\.openqa\.selenium\.By|(^|[^A-Za-z.])By\." $step_packages; then
            echo "FAIL: a locator reached a step definition (above)."
            exit 1
          fi
          echo "OK: no locator in any step definition."

      - name: Build and run the smoke suite
        run: ./mvnw -B clean verify -Psmoke

      - name: Scenario-execution gate
        run: |
          python3 .github/scripts/execution-report.py \
            --reports trident-demo-parabank/target/surefire-reports \
            --messages trident-demo-parabank/target/cucumber-messages.ndjson

      - name: Run the api suite
        run: ./mvnw -B verify -Papi

      - name: Scenario-execution gate - api suite
        run: |
          python3 .github/scripts/execution-report.py \
            --reports trident-demo-parabank/target/failsafe-reports \
            --messages trident-demo-parabank/target/failsafe-cucumber-messages.ndjson

      # Added for 1.1.0, and it should have been here the moment the third suite existed: this
      # release publishes trident-web, and without these two steps the module's own suite would
      # never run on the path that publishes it. A release gate that is weaker than the branch
      # gate is not a gate.
      - name: Run the web suite
        run: ./mvnw -B verify -Pweb

      - name: Scenario-execution gate - web suite
        run: |
          python3 .github/scripts/execution-report.py \
            --reports trident-demo-parabank/target/failsafe-web-reports \
            --messages trident-demo-parabank/target/web-cucumber-messages.ndjson

      - name: Publish
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: ./mvnw -B deploy -Prelease -DskipTests

      - name: Upload the published artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            */target/*.jar
            */target/*.asc
            */target/*.pom
          if-no-files-found: warn
