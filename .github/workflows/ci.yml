name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # The framework modules must not know which application is under test. The reference
      # implementation lives in its own module; if its name, its container or its fixtures
      # reach a published module, the framework has stopped being target-agnostic.
      - name: Framework modules know nothing about the target
        run: |
          if grep -riE "parabank|testcontainers|docker" \
               trident-core/src trident-api/src trident-runner/src \
               trident-core/pom.xml trident-api/pom.xml trident-runner/pom.xml; then
            echo "FAIL: target-specific reference found in a published module (above)."
            exit 1
          fi
          echo "OK: no target-specific references in trident-core, trident-api or trident-runner."

      # Rule: a scenario owns its data and never resets ParaBank underneath another test.
      # It is stated in CONTRIBUTING, in the strategy and in an ADR; this makes it checked.
      # Scoped to source trees because ADR 0011 documents ParaBank's own first-boot redirect
      # to initializeDB.htm and has to be able to name it.
      - name: No global database reset
        run: |
          if grep -rInE "cleanDB|initializeDB" --include='*.java' --include='*.feature' \
               --include='*.properties' --include='*.xml' */src .github; then
            echo "FAIL: a global ParaBank reset endpoint is referenced above."
            echo "Scenarios own their data; see docs/adr/0011-readiness-probe-triggers-schema-init.md."
            exit 1
          fi
          echo "OK: no reference to cleanDB or initializeDB in any source tree."

      # The quickstart promises Git and Java 21 are enough, and this step keeps that promise
      # honest. It has already caught one regression: a Cucumber @BeforeAll on a glue path both
      # suites loaded started ParaBank for the smoke run too, with every test still green.
      #
      # The check is on evidence, not on denial. Pointing DOCKER_HOST at a socket that does not
      # exist does NOT deny Docker: Testcontainers falls back to its other discovery
      # strategies and finds the runner's real socket anyway. That was measured - with the
      # lifecycle deliberately put back on the smoke glue path, the container started and the
      # build passed with the bogus DOCKER_HOST set, and again with
      # TESTCONTAINERS_DOCKER_CLIENT_STRATEGY forced. So instead of trying to hide Docker, this
      # asserts that the smoke run shows no sign of having used it.
      - name: Smoke suite must not need Docker
        env:
          DOCKER_HOST: unix:///nonexistent/trident-docker-must-not-be-used.sock
        run: |
          ./mvnw -B clean verify -Psmoke 2>&1 | tee smoke.log
          # Dependency resolution mentions testcontainers by name on a cold cache, which is not
          # container activity. Strip Maven's transfer lines first, then look for runtime
          # evidence only. A warm cache hid this: the check passed for the wrong reason.
          if grep -vE "^\\[INFO\\] (Downloading|Downloaded|Progress)" smoke.log \
             | grep -qE "Creating container for image|Ryuk started|ParaBank started|org\\.testcontainers\\.(containers|utility|DockerClientFactory)"; then
            echo "FAIL: the smoke suite touched a container. Matching lines:"
            grep -nE "Creating container for image|Ryuk started|ParaBank started|org\\.testcontainers\\." smoke.log | head -20
            exit 1
          fi
          echo "OK: the smoke run shows no container activity."
          rm -f smoke.log

      - name: Build and run the smoke suite
        run: ./mvnw -B clean verify -Psmoke

      # A green build is not evidence that anything ran. Surefire counts the JUnit Platform
      # suite container itself, so a run where Cucumber matched no scenarios still reports
      # tests="1" skipped="1" and failIfNoTests stays quiet. This step checks the executed
      # count and Cucumber's own message log independently, and prints both numbers before
      # asserting so a failure is diagnosable from the log alone.
      - name: Scenario-execution gate - smoke suite
        run: |
          python3 .github/scripts/execution-report.py \
            --reports trident-demo-parabank/target/surefire-reports \
            --messages trident-demo-parabank/target/cucumber-messages.ndjson

      # A test of the test infrastructure, not of the framework. The gate above is only
      # meaningful if the tag filter actually reaches the forked test JVM: if it did not,
      # every run would execute every scenario and the gate would pass for the wrong reason.
      # Filtering on a tag no scenario carries must therefore execute nothing.
      - name: Negative control - smoke suite
        run: |
          ./mvnw -B -pl trident-demo-parabank -am test -Psmoke -Dtrident.tags='@nonexistent'
          python3 .github/scripts/execution-report.py \
            --reports trident-demo-parabank/target/surefire-reports \
            --messages trident-demo-parabank/target/cucumber-messages.ndjson \
            --expect-zero-scenarios

      # Everything below needs Docker. It is a precondition of the api suite alone; the
      # steps above have already passed without it.
      # The claim the archetype exists to make, checked on every build rather than by hand:
      # generate a project with parameters unlike any used while writing the template, and run
      # its suite. Install first - the generated project resolves Trident from the local
      # repository.
      - name: Archetype produces a working project
        run: |
          ./mvnw -B -q install -DskipTests
          ./mvnw -B -pl trident-archetype verify -Dtrident.skip.archetype.it=false

      - name: Check Docker is available
        run: |
          docker info > /dev/null
          echo "Docker is available: $(docker --version)"

      - name: Run the api suite
        run: ./mvnw -B verify -Papi

      - name: Scenario-execution gate - api suite
        run: |
          python3 .github/scripts/execution-report.py \
            --reports trident-demo-parabank/target/failsafe-reports \
            --messages trident-demo-parabank/target/failsafe-cucumber-messages.ndjson

      - name: Negative control - api suite
        run: |
          ./mvnw -B verify -Papi -Dtrident.tags='@nonexistent'
          python3 .github/scripts/execution-report.py \
            --reports trident-demo-parabank/target/failsafe-reports \
            --messages trident-demo-parabank/target/failsafe-cucumber-messages.ndjson \
            --expect-zero-scenarios

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            trident-demo-parabank/target/surefire-reports/
            trident-demo-parabank/target/failsafe-reports/
            trident-demo-parabank/target/cucumber-messages.ndjson
            trident-demo-parabank/target/failsafe-cucumber-messages.ndjson
          if-no-files-found: warn
