# Test fixture, not shipped. It lives in test resources because it must not reach consumers:
# a consumer setting timeout.default.seconds=10 in their own default.properties would silently
# resolve 5 under the default `local` environment, overridden by a file whose only job is to
# demonstrate that MERGE falls back.
#
# Deliberately overrides a single key so that fallback is observable: the remaining four keys
# must resolve from default.properties.
timeout.default.seconds=5
