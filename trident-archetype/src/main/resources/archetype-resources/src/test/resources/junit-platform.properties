# cucumber.glue and cucumber.plugin are NOT declared here. Both suites share this file and need
# different values - different glue packages, and a separate message log each, or the second
# run overwrites the first. They are supplied per suite as JVM system properties from the
# Surefire and Failsafe blocks in pom.xml, which outrank this file.

# cucumber.filter.tags is not declared here either. It arrives the same way, composed from the
# active Maven profile, which is what routes a scenario to one suite and not the other.

# Parallel execution. This is your decision, not Trident's, which is why it is off here and
# documented rather than switched on for you.
#
# Turn it on when the suite is large enough to pay for the risk, and not before. Then measure,
# because the thing most likely to stop it working is not this file:
#
#   cucumber.execution.parallel.enabled=true
#   cucumber.execution.parallel.config.strategy=fixed
#   cucumber.execution.parallel.config.fixed.parallelism=4
#   cucumber.execution.parallel.config.fixed.max-pool-size=4
#
# Scenario level is the default once it is on: every scenario may run on its own thread. To pin
# the scenarios of one feature file to one thread, add:
#
#   cucumber.execution.execution-mode.feature=same_thread
#
# Two things have to be true before this helps.
#
# Your scenarios must own their data. If two scenarios share a fixture, concurrency will find
# it. Trident's reference suite creates a customer per scenario for exactly this reason.
#
# And your application has to survive concurrent use. That one is easy to assume and it is
# where Trident's own reference target failed: it cannot create two rows at once, so twenty
# parallel runs produced twenty red builds and not one of them was the suite's fault. Before
# blaming your tests, try the failing operation twice at once with curl.
# See docs/adr/0018-parallel-execution-at-scenario-level.md in the Trident repository.
cucumber.execution.parallel.enabled=false
