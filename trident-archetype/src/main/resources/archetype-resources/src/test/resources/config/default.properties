# Trident resolves configuration in two stages. First the active environment: the `env` system
# property, then the ENV environment variable, then `local`. Then these values, with system
# properties and environment variables above them.
#
# Override one value at run time:   mvn -Psmoke verify -Dapi.base.url=https://staging.example
# or with the mapped variable:      API_BASE_URL=https://staging.example mvn -Psmoke verify
#
# Add config/<env>.properties for a named environment. That is a different source path, so it
# merges with this file: keys you define win, keys you leave out fall back here. Replacing THIS
# file from another jar shadows it instead of merging, so keep all seven keys in it.

env=local
web.base.url=http://localhost
api.base.url=http://localhost
timeout.default.seconds=10
timeout.polling.millis=200
browser=chrome
browser.headless=true
